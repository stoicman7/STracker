<style>
  /* ==========================================
     RESET & BASE
  ========================================== */

  * {
    box-sizing: border-box;
  }

  html {
    scroll-behavior: smooth;
  }

  body {
    margin: 0;
    font-family:
      Inter,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      Arial,
      sans-serif;
    background: #f4f7fb;
    color: #172033;
    line-height: 1.6;
  }

  button,
  input,
  select {
    font: inherit;
  }


  /* ==========================================
     HEADER
  ========================================== */

  header {
    background:
      linear-gradient(
        135deg,
        #111827 0%,
        #1e293b 55%,
        #243b63 100%
      );
    color: white;
    padding: 42px 20px;
    text-align: center;
    box-shadow: 0 4px 20px rgba(15, 23, 42, 0.15);
  }

  header h1 {
    margin: 0 0 8px;
    font-size: 38px;
    font-weight: 800;
    letter-spacing: -1px;
  }

  header p {
    margin: 0;
    color: #cbd5e1;
    font-size: 16px;
  }


  /* ==========================================
     MAIN
  ========================================== */

  main {
    width: min(1100px, calc(100% - 32px));
    margin: 38px auto 70px;
  }


  /* ==========================================
     GENERAL CARDS
  ========================================== */

  .card {
    background: #ffffff;
    padding: 28px;
    border-radius: 16px;
    border: 1px solid #e5eaf1;
    box-shadow:
      0 5px 18px rgba(15, 23, 42, 0.06),
      0 1px 3px rgba(15, 23, 42, 0.04);
    margin-bottom: 24px;
  }

  .card h2 {
    margin-top: 0;
    margin-bottom: 8px;
    color: #172033;
    font-size: 22px;
  }

  .card > p {
    color: #64748b;
  }


  /* ==========================================
     SEARCH BOX
  ========================================== */

  .search-box {
    display: flex;
    gap: 10px;
    margin: 22px 0 12px;
  }

  .search-box input {
    flex: 1;
  }


  /* ==========================================
     INPUTS
  ========================================== */

  input,
  select {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid #d7dee8;
    border-radius: 10px;
    font-size: 15px;
    background: #ffffff;
    color: #172033;
    transition:
      border-color 0.2s ease,
      box-shadow 0.2s ease,
      background 0.2s ease;
  }

  input:hover,
  select:hover {
    border-color: #b8c4d4;
  }

  input:focus,
  select:focus {
    outline: none;
    border-color: #2563eb;
    box-shadow:
      0 0 0 3px rgba(37, 99, 235, 0.12);
  }

  input::placeholder {
    color: #9aa6b6;
  }


  /* ==========================================
     BUTTONS
  ========================================== */

  button {
    padding: 11px 17px;
    border: none;
    border-radius: 10px;
    background: #2563eb;
    color: white;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition:
      transform 0.15s ease,
      background 0.2s ease,
      box-shadow 0.2s ease;
  }

  button:hover {
    background: #1d4ed8;
    transform: translateY(-1px);
    box-shadow:
      0 4px 10px rgba(37, 99, 235, 0.18);
  }

  button:active {
    transform: translateY(0);
  }

  .secondary {
    background: #64748b;
  }

  .secondary:hover {
    background: #475569;
  }

  .danger {
    background: #dc2626;
  }

  .danger:hover {
    background: #b91c1c;
  }


  /* ==========================================
     FORM FIELDS
  ========================================== */

  .field {
    margin-bottom: 18px;
  }

  .field label {
    display: block;
    font-weight: 700;
    margin-bottom: 7px;
    color: #334155;
    font-size: 14px;
  }

  .hint {
    color: #7b8798;
    font-size: 13px;
    margin-top: 7px;
  }


  /* ==========================================
     ADVANCED GRID
  ========================================== */

  .advanced-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px 20px;
    margin-top: 24px;
  }

  .full-width {
    grid-column: 1 / -1;
  }


  /* ==========================================
     KEYWORD ROWS
  ========================================== */

  .keyword-row {
    display: flex;
    gap: 8px;
    margin-bottom: 9px;
  }

  .keyword-row input {
    flex: 1;
  }

  .keyword-row .danger {
    min-width: 42px;
    padding: 8px 12px;
  }


  /* ==========================================
     KEYWORD OPTIONS
  ========================================== */

  .keyword-options,
  .keyword-mode {
    margin-top: 15px;
    padding: 17px;
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
  }

  .keyword-options > label,
  .keyword-mode > label:first-child {
    display: block;
    font-weight: 700;
    margin-bottom: 12px;
    color: #334155;
  }

  .checkbox-group {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 18px;
    margin-bottom: 14px;
  }

  .checkbox-group label,
  .keyword-mode label {
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 6px;
    color: #475569;
  }

  .checkbox-group input,
  .keyword-mode input {
    width: auto;
    padding: 0;
    accent-color: #2563eb;
  }

  .keyword-mode {
    margin-top: 12px;
  }

  .keyword-mode > label:not(:first-child) {
    display: inline-flex;
    margin-right: 20px;
  }


  /* ==========================================
     ACCURACY
  ========================================== */

  .accuracy-value {
    display: inline-block;
    font-size: 27px;
    font-weight: 800;
    color: #2563eb;
    margin-bottom: 4px;
  }

  input[type="range"] {
    padding: 0;
    cursor: pointer;
    accent-color: #2563eb;
  }


  /* ==========================================
     FORM ACTIONS
  ========================================== */

  .actions {
    display: flex;
    gap: 10px;
    margin-top: 25px;
    flex-wrap: wrap;
  }

  #previewButton {
    background: #475569;
  }

  #previewButton:hover {
    background: #334155;
  }

  #advancedTrackButton {
    background: #2563eb;
  }

  #advancedTrackButton:hover {
    background: #1d4ed8;
  }


  /* ==========================================
     TRACKER DASHBOARD
  ========================================== */

  #trackedTopics {
    margin-top: 28px;
  }

  #trackedTopics > .card {
    padding: 26px;
  }

  #trackedTopics > .card > h2 {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 20px;
  }


  /* ==========================================
     INDIVIDUAL TRACKER
  ========================================== */

  .tracked-topic {
    position: relative;
    padding: 22px;
    margin-bottom: 16px;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    background:
      linear-gradient(
        180deg,
        #ffffff 0%,
        #f8fafc 100%
      );
    box-shadow:
      0 3px 12px rgba(15, 23, 42, 0.04);
    transition:
      border-color 0.2s ease,
      box-shadow 0.2s ease,
      transform 0.2s ease;
  }

  .tracked-topic:hover {
    border-color: #cbd5e1;
    box-shadow:
      0 7px 20px rgba(15, 23, 42, 0.07);
    transform: translateY(-1px);
  }

  .tracked-topic:last-child {
    margin-bottom: 0;
  }

  .tracked-topic h3 {
    margin: 0 0 18px;
    font-size: 18px;
    color: #1e293b;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .tracked-topic p {
    margin: 9px 0;
    color: #475569;
    font-size: 14px;
  }

  .tracked-topic strong {
    color: #334155;
  }


  /* ==========================================
     TRACKER BADGES
  ========================================== */

  .badge {
    display: inline-flex;
    align-items: center;
    background: #eff6ff;
    color: #1d4ed8;
    padding: 5px 9px;
    border-radius: 7px;
    font-size: 12px;
    font-weight: 600;
    margin-right: 5px;
    margin-bottom: 5px;
    border: 1px solid #dbeafe;
  }


  /* ==========================================
     TRACKER ACTIONS
  ========================================== */

  .tracked-topic .actions {
    margin-top: 20px;
    padding-top: 17px;
    border-top: 1px solid #e2e8f0;
  }

  .view-tracker-button {
    background: #2563eb;
  }

  .check-tracker-button {
    background: #0f766e;
  }

  .check-tracker-button:hover {
    background: #115e59;
  }

  .delete-tracker-button {
    background: #dc2626;
  }


  /* ==========================================
     RESULTS HEADER
  ========================================== */

  #resultCounter {
    margin: 8px 0 0;
    color: #64748b;
    font-size: 14px;
    font-weight: 500;
  }


  /* ==========================================
     PAPER CARDS
  ========================================== */

  .paper {
    background: #ffffff;
    padding: 25px;
    border-radius: 14px;
    border: 1px solid #e2e8f0;
    box-shadow:
      0 4px 14px rgba(15, 23, 42, 0.05);
    margin-bottom: 18px;
    transition:
      border-color 0.2s ease,
      box-shadow 0.2s ease,
      transform 0.2s ease;
  }

  .paper:hover {
    border-color: #cbd5e1;
    box-shadow:
      0 8px 22px rgba(15, 23, 42, 0.07);
    transform: translateY(-1px);
  }

  .paper h2 {
    margin: 8px 0 13px;
    color: #172033;
    font-size: 20px;
    line-height: 1.4;
  }

  .paper p {
    color: #64748b;
    margin: 7px 0;
  }

  .paper strong {
    color: #334155;
  }

  .paper a {
    display: inline-block;
    margin-top: 12px;
    color: #2563eb;
    font-weight: 700;
    text-decoration: none;
  }

  .paper a:hover {
    text-decoration: underline;
  }


  /* ==========================================
     NEW / SEEN BADGES
  ========================================== */

  .paper .badge[style*="dcfce7"] {
    border-color: #bbf7d0;
  }

  .paper .badge[style*="e5e7eb"] {
    border-color: #d1d5db;
  }


  /* ==========================================
     LOAD MORE
  ========================================== */

  #loadMoreArea {
    padding: 5px 0 15px;
  }

  #loadMoreArea button {
    min-width: 130px;
  }


  /* ==========================================
     RANGE SLIDER
  ========================================== */

  input[type="range"] {
    height: 6px;
    border: none;
    background: #dbe3ee;
    border-radius: 999px;
  }


  /* ==========================================
     MOBILE
  ========================================== */

  @media (max-width: 700px) {

    header {
      padding: 32px 16px;
    }

    header h1 {
      font-size: 31px;
    }

    main {
      width: min(100% - 20px, 1100px);
      margin-top: 20px;
    }

    .card {
      padding: 20px;
      border-radius: 13px;
    }

    .advanced-grid {
      grid-template-columns: 1fr;
      gap: 14px;
    }

    .full-width {
      grid-column: auto;
    }

    .search-box {
      flex-direction: column;
    }

    .search-box button {
      width: 100%;
    }

    .keyword-row {
      align-items: stretch;
    }

    .keyword-row .danger {
      min-width: 42px;
    }

    .actions {
      flex-direction: column;
    }

    .actions button {
      width: 100%;
    }

    .tracked-topic {
      padding: 18px;
    }

    .tracked-topic h3 {
      font-size: 17px;
    }

    .paper {
      padding: 19px;
    }

    .paper h2 {
      font-size: 18px;
    }

  }


  /* ==========================================
     SMALL MOBILE
  ========================================== */

  @media (max-width: 450px) {

    main {
      width: calc(100% - 14px);
    }

    .card {
      padding: 17px;
    }

    .tracked-topic {
      padding: 15px;
    }

    .tracked-topic .actions {
      gap: 8px;
    }

    .keyword-options,
    .keyword-mode {
      padding: 13px;
    }

    .checkbox-group {
      flex-direction: column;
      gap: 9px;
    }

  }
</style>
